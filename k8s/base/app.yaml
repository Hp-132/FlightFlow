            - configMapRef: { name: reflight-config }
          ports:
            - containerPort: 8100
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: partners
  namespace: reflight
spec:
  selector: { app: partners }
  ports:
    - port: 8100
      targetPort: 8100
---
