            limits: { cpu: "2", memory: 1Gi }
---
# The one that KEDA scales. 100m CPU / 128Mi so 20 replicas still fit on a
# laptop (section 10).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: reflight
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: reflight:dev
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          envFrom:
            - secretRef: { name: reflight-secrets }
            - configMapRef: { name: reflight-config }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
