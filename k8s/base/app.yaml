# Reflight services. All six run the same reflight:dev image with a
# different argument, exactly as in docker-compose.yml.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: reflight
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: reflight:dev
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - secretRef: { name: reflight-secrets }
            - configMapRef: { name: reflight-config }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: reflight
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:latest
          envFrom:
            - secretRef: { name: reflight-secrets }
            - configMapRef: { name: reflight-config }
          command: ["sh", "-c"]
          args:
            - >-
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD";
              do echo "waiting for minio"; sleep 3; done &&
              mc mb -p "local/$MINIO_BUCKET" || true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: reflight
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: reflight:dev
          imagePullPolicy: IfNotPresent
          args: ["api"]
          envFrom:
            - secretRef: { name: reflight-secrets }
            - configMapRef: { name: reflight-config }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: reflight
spec:
  selector: { app: api }
  ports:
    - port: 8000
      targetPort: 8000
---
