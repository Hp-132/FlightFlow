# KEDA scales workers on saga.steps queue depth (section 10).
#
# target 20 messages per replica: a step averages well under a second, so
# one replica clears 20 queued steps quickly; anything lower makes KEDA
# thrash on short bursts. Tune after measuring step duration on your own
# machine -- the number in the README came from `make demo-d5`.
apiVersion: v1
kind: Secret
metadata:
  name: keda-rabbitmq
  namespace: reflight
type: Opaque
stringData:
  # Overwritten by `make k3d-up` from .env; this placeholder keeps the
  # manifest valid on its own.
  host: amqp://reflight:changeme@rabbitmq.reflight.svc.cluster.local:5672/
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
  namespace: reflight
spec:
  secretTargetRef:
    - parameter: host
      name: keda-rabbitmq
      key: host
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker
  namespace: reflight
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 1
  maxReplicaCount: 20
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: saga.steps
        mode: QueueLength
        value: "20"
      authenticationRef:
        name: rabbitmq-auth
